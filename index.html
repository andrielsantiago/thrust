<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin - THRUST PARFUMS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --dourado: #c9a227; --dourado-claro: #f5d97a; --fundo: #0d0d0d; --card: #1a1a1a; --borda: rgba(212,175,55,0.25); }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--fundo); color: #fff; padding: 15px; padding-bottom: 50px; overflow-x: hidden; }
  
  #tela-login, #painel { display: none; } 
  #tela-carregando { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: var(--dourado-claro); font-family: 'Playfair Display', serif; font-size: 1.2rem; }
  .spinner { border: 3px solid rgba(212,175,55,0.3); border-top: 3px solid var(--dourado); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  /* LOGIN */
  .login-box { background: var(--card); padding: 40px 20px; border-radius: 10px; text-align: center; max-width: 400px; margin: 80px auto; border: 1px solid var(--dourado); }
  .login-box h1 { color: var(--dourado-claro); font-family: 'Playfair Display', serif; margin-bottom: 10px; }
  .btn-google { background: #fff; color: #333; border: none; padding: 15px 20px; font-size: 1rem; font-weight: bold; border-radius: 30px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 30px; transition: 0.3s; }
  .btn-google:hover { background: #eee; transform: scale(0.98); }
  
  /* PAINEL */
  #painel { max-width: 700px; margin: 0 auto; }
  .header-admin { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borda); padding-bottom: 15px; margin-bottom: 20px; }
  .header-admin h1 { font-family: 'Playfair Display', serif; color: var(--dourado-claro); font-size: 1.3rem; }
  .btn-sair { background: transparent; border: 1px solid #c94a4a; color: #c94a4a; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
  .btn-sair:hover { background: #c94a4a; color: #fff; }
  
  .msg { padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; text-align: center; font-size: 0.85rem; font-weight: bold; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; max-width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
  .msg.sucesso { background: #111; color: #25D366; border: 1px solid #25D366; display: block; }
  .msg.erro { background: #111; color: #ff4444; border: 1px solid #ff4444; display: block; }

  /* MENU CARDS */
  .menu-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 25px;
  }
  @media (min-width: 600px) {
    .menu-cards { grid-template-columns: 1fr 1fr 1fr 1fr; }
  }

  .menu-card {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px 10px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 110px;
  }
  .menu-card:hover, .menu-card.active {
    border-color: var(--dourado);
    background: rgba(212,175,55,0.1);
    transform: translateY(-3px);
    box-shadow: 0 5px 15px rgba(212,175,55,0.2);
  }
  .menu-card img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  }
  .menu-card span {
    font-weight: 700;
    font-size: 0.7rem;
    color: var(--dourado-claro);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.2;
  }
  .menu-card.active span { color: #fff; }

  /* SEÇÕES */
  .section-content { display: none; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .section-content.active { display: block; }

  .section-title {
    font-family: 'Playfair Display', serif;
    color: var(--dourado-claro);
    font-size: 1.2rem;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--borda);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* FORMULÁRIO */
  .btn-cancelar-edit { background: #c94a4a; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; display: none; }
  
  .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid-full { display: grid; grid-template-columns: 1fr; gap: 10px; }
  
  .input-group { margin-bottom: 10px; }
  .input-group label { display: block; font-size: 0.7rem; color: #aaa; margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; font-family: inherit; font-size: 0.85rem; }
  .input-group input:focus, .input-group textarea:focus { outline: none; border-color: var(--dourado); }
  
  .upload-area { display: flex; flex-direction: column; gap: 8px; }
  .upload-btn { background: rgba(212,175,55,0.1); border: 1px dashed var(--dourado); color: var(--dourado-claro); padding: 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; text-align: center; transition: 0.2s; position: relative; }
  .upload-btn:hover { background: rgba(212,175,55,0.2); }
  .upload-btn input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .upload-status { font-size: 0.75rem; color: #25D366; font-weight: 600; display: none; text-align: center; }

  .tamanhos-box { border: 1px dashed #444; padding: 12px; border-radius: 6px; margin-bottom: 15px; background: rgba(255,255,255,0.02); }
  .tamanhos-box h3 { font-size: 0.8rem; color: var(--dourado); margin-bottom: 10px; text-transform: uppercase; }
  .tamanho-row { display: grid; grid-template-columns: 30px 50px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; background: #222; padding: 8px 10px; border-radius: 6px; }
  .tamanho-row:last-child { margin-bottom: 0; }
  .tamanho-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--dourado); cursor: pointer; }
  .tamanho-row .label-tam { font-weight: bold; color: #fff; font-size: 0.85rem; }
  .tamanho-row input[type="number"] { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: #fff; font-size: 0.85rem; }

  .toggles-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
  .check-box { display: flex; align-items: center; gap: 8px; background: rgba(212,175,55,0.1); border: 1px solid var(--dourado); padding: 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  .check-box.danger { border-color: #c94a4a; background: rgba(201,74,74,0.1); }
  .check-box input { width: 18px; height: 18px; accent-color: var(--dourado); cursor: pointer; }
  .check-box.danger input { accent-color: #c94a4a; }
  .check-box span { font-weight: 600; color: var(--dourado-claro); font-size: 0.75rem; line-height: 1.2; }
  .check-box.danger span { color: #ff6b6b; }

  .btn-salvar { background: linear-gradient(180deg, var(--dourado-claro), var(--dourado)); color: #0d0d0d; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 30px; cursor: pointer; font-size: 0.95rem; transition: 0.3s; margin-top: 10px; }
  .btn-salvar:hover { box-shadow: 0 0 20px rgba(212,175,55,0.4); }
  .btn-salvar:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ESTOQUE SECTION */
  .estoque-item {
    background: #151515;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    flex-wrap: wrap;
  }
  .estoque-item .info { flex: 1; min-width: 150px; }
  .estoque-item .info strong { color: var(--dourado-claro); display: block; font-size: 0.95rem; }
  .estoque-item .info small { color: #888; font-size: 0.7rem; }
  .estoque-item .controle { display: flex; align-items: center; gap: 8px; }
  .estoque-item input {
    width: 70px;
    padding: 10px;
    font-size: 1.1rem;
    font-weight: bold;
    text-align: center;
    border: 2px solid var(--dourado);
    border-radius: 8px;
    background: #111;
    color: var(--dourado-claro);
    font-family: inherit;
    outline: none;
  }
  .estoque-item input:focus { border-color: var(--dourado-claro); }
  .btn-salvar-estoque { background: var(--dourado); color: #0d0d0d; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }

  /* LISTA CATÁLOGO */
  .lista-header-actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
  .search-admin { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #111; color: #fff; font-family: inherit; font-size: 0.85rem; }
  .search-admin:focus { outline: none; border-color: var(--dourado); }

  .abas-admin { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
  .abas-admin::-webkit-scrollbar { display: none; }
  .aba-btn { background: none; border: 1px solid #444; color: #888; font-weight: 600; font-size: 0.75rem; cursor: pointer; padding: 6px 12px; border-radius: 20px; transition: 0.2s; white-space: nowrap; }
  .aba-btn.active { color: #0d0d0d; background: var(--dourado); border-color: var(--dourado); }
  .aba-btn.esgotados.active { background: #c94a4a; border-color: #c94a4a; color: #fff; }
  
  .item-admin { display: flex; flex-direction: column; border-bottom: 1px solid #333; padding: 12px 0; gap: 10px; }
  .item-admin:last-child { border-bottom: none; }
  
  .item-topo { display: flex; align-items: flex-start; gap: 12px; }
  .item-topo img { width: 45px; height: 45px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px; flex-shrink: 0; }
  .item-dados { flex: 1; min-width: 0; }
  .item-dados .nome { color: var(--dourado-claro); font-weight: bold; font-size: 0.95rem; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
  .item-dados .detalhes { color: #888; font-size: 0.7rem; margin-top: 3px; line-height: 1.4; }
  .status-off { color: #ff6b6b; font-size: 0.65rem; font-weight: bold; background: rgba(255,0,0,0.1); padding: 2px 6px; border-radius: 4px; }
  .status-estoque { color: #4a90e2; font-size: 0.7rem; font-weight: bold; margin-left: 5px; }
  
  .item-acoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  @media (max-width: 500px) { .item-acoes { grid-template-columns: 1fr 1fr; } }
  
  .btn-acao { background: transparent; padding: 8px 4px; border-radius: 6px; cursor: pointer; font-size: 0.72rem; font-weight: bold; transition: 0.2s; border: 1px solid transparent; text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-copiar { border-color: #4a90e2; color: #4a90e2; }
  .btn-copiar:active { background: #4a90e2; color: #fff; }
  .btn-editar { border-color: var(--dourado); color: var(--dourado); }
  .btn-editar:active { background: var(--dourado); color: #0d0d0d; }
  .btn-pausar { border-color: #ff9800; color: #ff9800; }
  .btn-pausar:active { background: #ff9800; color: #fff; }
  .btn-ativar { border-color: #25D366; color: #25D366; background: rgba(37,211,102,0.05); }
  .btn-ativar:active { background: #25D366; color: #fff; }
  .btn-excluir { border-color: #c94a4a; color: #c94a4a; }
  .btn-excluir:active { background: #c94a4a; color: white; }

  /* PEDIDOS */
  .pedido-item { background: #151515; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
  .pedido-item.concretizado { border-color: #25D366; opacity: 0.7; }
  .pedido-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 8px; flex-wrap: wrap; gap: 5px; }
  .pedido-data { font-size: 0.75rem; color: #888; }
  .pedido-total { font-size: 1rem; font-weight: bold; color: var(--dourado-claro); }
  .pedido-itens { list-style: none; padding: 0; margin: 0 0 10px 0; }
  .pedido-itens li { font-size: 0.8rem; color: #ccc; padding: 3px 0; display: flex; justify-content: space-between; border-bottom: 1px dashed #333; gap: 10px; }
  .pedido-itens li:last-child { border-bottom: none; }
  
  .btn-concretizada {
    background: rgba(37,211,102,0.15);
    border: 1px solid #25D366;
    color: #25D366;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
    font-weight: bold;
    font-size: 0.8rem;
    cursor: pointer;
    transition: 0.2s;
    margin-top: 5px;
  }
  .btn-concretizada:hover { background: #25D366; color: #0d0d0d; }
  .btn-concretizada.concretizada { background: #25D366; color: #0d0d0d; cursor: default; }

  .btn-limpar-pedidos {
    background: transparent;
    border: 1px solid #c94a4a;
    color: #c94a4a;
    padding: 10px;
    border-radius: 8px;
    width: 100%;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    margin-top: 15px;
    transition: 0.2s;
  }
  .btn-limpar-pedidos:hover { background: #c94a4a; color: #fff; }
  .btn-limpar-pedidos:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (min-width: 600px) {
    .item-admin { flex-direction: row; align-items: center; justify-content: space-between; }
    .item-dados .nome { font-size: 1rem; }
  }
</style>
</head>
<body>

<div id="tela-carregando">
  <div class="spinner"></div>
  Verificando acesso...
</div>

<div id="tela-login">
  <div class="login-box">
    <h1>Painel THRUST</h1>
    <p style="color:#888; font-size:0.9rem;">Acesso restrito.</p>
    <button class="btn-google" id="btn-google">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="24">
      Entrar com o Google
    </button>
  </div>
</div>

<div id="painel">
  <div class="header-admin">
    <h1>Painel Admin</h1>
    <button class="btn-sair" id="btn-sair">Sair</button>
  </div>

  <div class="msg" id="mensagem"></div>

  <!-- MENU -->
  <div class="menu-cards">
    <div class="menu-card" onclick="abrirSecao('form', this)">
      <img src="https://img.icons8.com/color/96/add-property.png" alt="Cadastrar">
      <span>Cadastrar</span>
    </div>
    <div class="menu-card" onclick="abrirSecao('lista', this)">
      <img src="https://img.icons8.com/color/96/stack-of-photos.png" alt="Catálogo">
      <span>Catálogo</span>
    </div>
    <div class="menu-card" onclick="abrirSecao('estoque', this)">
      <img src="https://img.icons8.com/color/96/box.png" alt="Estoque">
      <span>Estoque</span>
    </div>
    <div class="menu-card" onclick="abrirSecao('pedidos', this)">
      <img src="https://img.icons8.com/color/96/shopping-cart--v1.png" alt="Pedidos">
      <span>Pedidos</span>
    </div>
  </div>

  <!-- CADASTRAR -->
  <div class="section-content" id="section-form">
    <h2 class="section-title">
      <span id="form-titulo">Adicionar Novo Perfume</span>
      <button class="btn-cancelar-edit" id="btn-cancelar-edit" onclick="cancelarEdicao()">Cancelar</button>
    </h2>
    
    <form id="form-perfume">
      <input type="hidden" id="edit-id" value="">
      
      <div class="grid-inputs">
        <div class="input-group">
          <label>Nome *</label>
          <input type="text" id="nome" required placeholder="Ex: Femme Fatale">
        </div>
        <div class="input-group">
          <label>Inspirado em *</label>
          <input type="text" id="insp" required placeholder="Ex: Good Girl">
        </div>
      </div>

      <div class="grid-inputs">
        <div class="input-group">
          <label>Categoria *</label>
          <select id="cat" required>
            <option value="" disabled selected>Selecione...</option>
            <option value="feminino">Feminino</option>
            <option value="masculino">Masculino</option>
            <option value="compartilhado">Compartilhado</option>
          </select>
        </div>
        
        <div class="input-group">
          <label>Imagem do Perfume</label>
          <div class="upload-area">
            <div class="upload-btn" id="btn-upload">
              <input type="file" id="file-img" accept="image/*" onchange="fazerUpload(event)">
              📷 Escolher Imagem
            </div>
            <div class="upload-status" id="upload-status">Enviando...</div>
          </div>
          <input type="url" id="img" placeholder="Ou cole o link: https://..." style="margin-top: 8px;">
        </div>
      </div>

      <div class="tamanhos-box">
        <h3>Tamanhos e Preços *</h3>
        <div class="tamanho-row">
          <input type="checkbox" id="chk-30">
          <span class="label-tam">30ml</span>
          <input type="number" step="0.01" id="preco-30" placeholder="R$ 59,90">
        </div>
        <div class="tamanho-row">
          <input type="checkbox" id="chk-50" checked>
          <span class="label-tam">50ml</span>
          <input type="number" step="0.01" id="preco-50" placeholder="R$ 79,90">
        </div>
        <div class="tamanho-row">
          <input type="checkbox" id="chk-100">
          <span class="label-tam">100ml</span>
          <input type="number" step="0.01" id="preco-100" placeholder="R$ 139,90">
        </div>
      </div>

      <div class="toggles-row">
        <label class="check-box">
          <input type="checkbox" id="vendido">
          <span>🔥 Mais Vendido</span>
        </label>
        <label class="check-box danger">
          <input type="checkbox" id="indisponivel">
          <span>Forçar Indisponível</span>
        </label>
      </div>

      <div class="grid-full">
        <div class="input-group">
          <label>Descrição *</label>
          <textarea id="desc" rows="2" required placeholder="Sobre a fragrância..."></textarea>
        </div>
      </div>

      <div class="grid-inputs">
        <div class="input-group">
          <label>Notas Topo *</label>
          <input type="text" id="topo" required placeholder="Amêndoa...">
        </div>
        <div class="input-group">
          <label>Notas Coração *</label>
          <input type="text" id="coracao" required placeholder="Jasmim...">
        </div>
      </div>
      <div class="grid-full">
        <div class="input-group">
          <label>Notas Fundo *</label>
          <input type="text" id="fundo" required placeholder="Baunilha...">
        </div>
      </div>

      <button type="submit" class="btn-salvar" id="btn-submit">Salvar no Catálogo</button>
    </form>
  </div>

  <!-- CATÁLOGO -->
  <div class="section-content" id="section-lista">
    <h2 class="section-title">Perfumes no Catálogo</h2>
    
    <div class="lista-header-actions">
      <input type="text" class="search-admin" id="search-admin" placeholder="🔍 Buscar por nome ou inspiração...">
      <div class="abas-admin">
        <button class="aba-btn active" data-cat="todos">Todos</button>
        <button class="aba-btn" data-cat="feminino">Fem</button>
        <button class="aba-btn" data-cat="masculino">Masc</button>
        <button class="aba-btn" data-cat="compartilhado">Uni</button>
        <button class="aba-btn esgotados" data-cat="esgotados">🚫 Esgotados</button>
      </div>
    </div>
    <div id="lista-perfumes-admin"></div>
  </div>

  <!-- ESTOQUE -->
  <div class="section-content" id="section-estoque">
    <h2 class="section-title">Controle de Estoque</h2>
    <div id="lista-estoque"></div>
  </div>

  <!-- PEDIDOS -->
  <div class="section-content" id="section-pedidos">
    <h2 class="section-title">Histórico de Pedidos</h2>
    <div id="lista-pedidos"></div>
    <button class="btn-limpar-pedidos" id="btn-limpar-pedidos" onclick="limparPedidos()">
      🗑️ Limpar Todo o Histórico
    </button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
  import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCtdszBtbQiaZnWcLLKBPnwo_3yHRtp2mA",
    authDomain: "thrustperfumes.firebaseapp.com",
    projectId: "thrustperfumes",
    storageBucket: "thrustperfumes.firebasestorage.app",
    messagingSenderId: "772745912522",
    appId: "1:772745912522:web:efaa2b56877dc4b880d433"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const ADMIN_EMAIL = "ewerton.andriel@gmail.com"; 
  const URL_CATALOGO = "https://thrustperfumes.store/"; 
  const IMGBB_API_KEY = "8c63b7330444870944b040c580b44ab0"; 

  const telaCarregando = document.getElementById('tela-carregando');
  const telaLogin = document.getElementById('tela-login');
  const painel = document.getElementById('painel');
  const btnGoogle = document.getElementById('btn-google');
  const btnSair = document.getElementById('btn-sair');
  const listaAdmin = document.getElementById('lista-perfumes-admin');
  const listaPedidos = document.getElementById('lista-pedidos');
  const listaEstoque = document.getElementById('lista-estoque');
  const formPerfume = document.getElementById('form-perfume');
  const msgDiv = document.getElementById('mensagem');
  const btnSubmit = document.getElementById('btn-submit');
  const btnLimparPedidos = document.getElementById('btn-limpar-pedidos');
  
  const searchAdmin = document.getElementById('search-admin');
  const abasAdmin = document.querySelectorAll('.aba-btn');
  let categoriaFiltroAdmin = 'todos';
  let termoBuscaAdmin = '';
  let todosPerfumesAdmin = []; 

  const editId = document.getElementById('edit-id');
  const formTitulo = document.getElementById('form-titulo');
  const btnCancelarEdit = document.getElementById('btn-cancelar-edit');

  window.abrirSecao = function(secao, el) {
    document.querySelectorAll('.menu-card').forEach(c => c.classList.remove('active'));
    document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
    
    if (el) el.classList.add('active');
    document.getElementById('section-' + secao).classList.add('active');
    
    if (secao === 'estoque') renderizarEstoque();

    document.getElementById('section-' + secao).scrollIntoView({ behavior: 'smooth' });
  };

  window.fazerUpload = async function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const btnUpload = document.getElementById('btn-upload');
    const statusUpload = document.getElementById('upload-status');
    const inputLink = document.getElementById('img');

    btnUpload.style.display = 'none';
    statusUpload.style.display = 'block';
    statusUpload.innerText = "Fazendo upload...";
    statusUpload.style.color = "var(--dourado)";

    try {
      const formData = new FormData();
      formData.append("image", file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (data.success) {
        inputLink.value = data.data.url;
        statusUpload.innerText = "✓ Upload concluído!";
        statusUpload.style.color = "#25D366";
        setTimeout(() => {
          btnUpload.style.display = 'block';
          statusUpload.style.display = 'none';
        }, 2000);
      } else {
        throw new Error("Erro no upload");
      }
    } catch (error) {
      console.error(error);
      statusUpload.innerText = "❌ Erro ao enviar.";
      statusUpload.style.color = "#ff4444";
      setTimeout(() => {
        btnUpload.style.display = 'block';
        statusUpload.style.display = 'none';
      }, 3000);
    }
  };

  btnGoogle.addEventListener('click', () => {
    const provider = new GoogleAuthProvider();
    signInWithPopup(auth, provider).catch(err => alert("Erro ao logar: " + err.message));
  });
  btnSair.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    telaCarregando.style.display = 'none';
    if (user) {
      if (user.email === ADMIN_EMAIL) {
        telaLogin.style.display = 'none';
        painel.style.display = 'block';
        if(todosPerfumesAdmin.length === 0) carregarListaAdmin();
        carregarPedidos();
      } else {
        alert("Acesso negado.");
        signOut(auth);
        telaLogin.style.display = 'block';
      }
    } else {
      telaLogin.style.display = 'block';
      painel.style.display = 'none';
    }
  });

  formPerfume.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    let temTamanho = false;
    if(document.getElementById('chk-30').checked && document.getElementById('preco-30').value) temTamanho = true;
    if(document.getElementById('chk-50').checked && document.getElementById('preco-50').value) temTamanho = true;
    if(document.getElementById('chk-100').checked && document.getElementById('preco-100').value) temTamanho = true;
    
    if(!temTamanho) {
      mostrarMsg("Obrigatório: Marque pelo menos um tamanho e insira o preço.", "erro");
      return;
    }

    btnSubmit.innerText = "Salvando...";
    btnSubmit.disabled = true;

    const tamanhos = {};
    if(document.getElementById('chk-30').checked && document.getElementById('preco-30').value) tamanhos["30ml"] = parseFloat(document.getElementById('preco-30').value);
    if(document.getElementById('chk-50').checked && document.getElementById('preco-50').value) tamanhos["50ml"] = parseFloat(document.getElementById('preco-50').value);
    if(document.getElementById('chk-100').checked && document.getElementById('preco-100').value) tamanhos["100ml"] = parseFloat(document.getElementById('preco-100').value);

    const dadosPerfume = {
      nome: document.getElementById('nome').value,
      insp: document.getElementById('insp').value,
      cat: document.getElementById('cat').value,
      img: document.getElementById('img').value || "COLE_O_LINK_AQUI",
      tamanhos: tamanhos,
      vendido: document.getElementById('vendido').checked,
      indisponivel: document.getElementById('indisponivel').checked,
      desc: document.getElementById('desc').value,
      notas: {
        topo: document.getElementById('topo').value,
        coracao: document.getElementById('coracao').value,
        fundo: document.getElementById('fundo').value
      }
    };

    try {
      if (editId.value) {
        await updateDoc(doc(db, "perfumes", editId.value), dadosPerfume);
        mostrarMsg("Perfume atualizado!", "sucesso");
        limparFormulario(); 
      } else {
        dadosPerfume.criadoEm = new Date();
        dadosPerfume.estoque = 5;
        await addDoc(collection(db, "perfumes"), dadosPerfume);
        mostrarMsg("Perfume cadastrado com 5 unidades em estoque!", "sucesso");
        limparFormulario();
      }
      abrirSecao('lista', document.querySelectorAll('.menu-card')[1]); 
    } catch (error) {
      console.error(error);
      mostrarMsg("Erro ao salvar.", "erro");
    } finally {
      btnSubmit.innerText = editId.value ? "Atualizar Perfume" : "Salvar no Catálogo";
      btnSubmit.disabled = false;
    }
  });

  function limparFormulario() {
    formPerfume.reset();
    document.getElementById('chk-50').checked = true;
    editId.value = '';
    formTitulo.innerText = "Adicionar Novo Perfume";
    btnSubmit.innerText = "Salvar no Catálogo";
    btnCancelarEdit.style.display = 'none';
  }

  window.cancelarEdicao = function() {
    limparFormulario();
    abrirSecao('lista', document.querySelectorAll('.menu-card')[1]);
  };

  window.prepararEdicao = function(id) {
    const p = todosPerfumesAdmin.find(item => item.id === id);
    if(!p) return;

    document.getElementById('nome').value = p.nome;
    document.getElementById('insp').value = p.insp;
    document.getElementById('cat').value = p.cat;
    document.getElementById('img').value = p.img === 'COLE_O_LINK_AQUI' ? '' : p.img;
    
    document.getElementById('chk-30').checked = !!p.tamanhos?.["30ml"];
    document.getElementById('preco-30').value = p.tamanhos?.["30ml"] || '';
    document.getElementById('chk-50').checked = !!p.tamanhos?.["50ml"];
    document.getElementById('preco-50').value = p.tamanhos?.["50ml"] || '';
    document.getElementById('chk-100').checked = !!p.tamanhos?.["100ml"];
    document.getElementById('preco-100').value = p.tamanhos?.["100ml"] || '';
    
    document.getElementById('vendido').checked = p.vendido || false;
    document.getElementById('indisponivel').checked = p.indisponivel || false;

    document.getElementById('desc').value = p.desc || '';
    document.getElementById('topo').value = p.notas?.topo || '';
    document.getElementById('coracao').value = p.notas?.coracao || '';
    document.getElementById('fundo').value = p.notas?.fundo || '';

    editId.value = id;
    formTitulo.innerText = "Editando...";
    btnSubmit.innerText = "Atualizar Perfume";
    btnCancelarEdit.style.display = 'block';

    abrirSecao('form', document.querySelectorAll('.menu-card')[0]);
  };

  function carregarListaAdmin() {
    const q = query(collection(db, "perfumes"), orderBy("nome"));
    onSnapshot(q, (snapshot) => {
      todosPerfumesAdmin = [];
      snapshot.forEach((docSnap) => {
        todosPerfumesAdmin.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderizarListaAdmin(); 
      if (document.getElementById('section-estoque').classList.contains('active')) {
        renderizarEstoque();
      }
    });
  }

  abasAdmin.forEach(btn => {
    btn.addEventListener('click', (e) => {
      abasAdmin.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      categoriaFiltroAdmin = e.target.getAttribute('data-cat');
      renderizarListaAdmin();
    });
  });

  searchAdmin.addEventListener('input', (e) => {
    termoBuscaAdmin = e.target.value.toLowerCase();
    renderizarListaAdmin();
  });

  function renderizarListaAdmin() {
    listaAdmin.innerHTML = '';
    
    let listaFiltrada = todosPerfumesAdmin;

    if (categoriaFiltroAdmin === 'esgotados') {
      listaFiltrada = listaFiltrada.filter(p => p.indisponivel === true || p.estoque === 0);
    } else if (categoriaFiltroAdmin !== 'todos') {
      listaFiltrada = listaFiltrada.filter(p => p.cat === categoriaFiltroAdmin);
    }
    
    if (termoBuscaAdmin) {
      listaFiltrada = listaFiltrada.filter(p => 
        p.nome.toLowerCase().includes(termoBuscaAdmin) || 
        (p.insp && p.insp.toLowerCase().includes(termoBuscaAdmin))
      );
    }

    if (listaFiltrada.length === 0) {
      listaAdmin.innerHTML = '<p style="color:#666; text-align:center; padding:20px; font-size:0.85rem;">Nenhum perfume encontrado.</p>';
      return;
    }

    listaFiltrada.forEach((p) => {
      let precoExibir = "Preço indisponível";
      if(p.tamanhos) {
        const keys = Object.keys(p.tamanhos);
        if (keys.length > 0) {
          let tamEscolhido = p.tamanhos["50ml"] ? "50ml" : keys[0];
          precoExibir = `R$ ${p.tamanhos[tamEscolhido].toFixed(2).replace('.', ',')} (${tamEscolhido})`;
        }
      }

      let estoqueHtml = '';
      if (p.estoque !== undefined) {
        if (p.estoque > 0) {
          estoqueHtml = `<span class="status-estoque">📦 ${p.estoque} un.</span>`;
        } else {
          estoqueHtml = `<span class="status-off">Sem Estoque</span>`;
        }
      }

      let btnStatus = '';
      if (p.indisponivel || p.estoque === 0) {
        btnStatus = `<button class="btn-acao btn-ativar" onclick="toggleEstoque('${p.id}', false)" title="Ativar Vendas">▶️ Ativar</button>`;
      } else {
        btnStatus = `<button class="btn-acao btn-pausar" onclick="toggleEstoque('${p.id}', true)" title="Pausar Vendas">⏸️ Pausar</button>`;
      }

      const div = document.createElement('div');
      div.className = 'item-admin';
      div.innerHTML = `
        <div class="item-topo">
          <img src="${p.img !== 'COLE_O_LINK_AQUI' ? p.img : 'https://via.placeholder.com/45'}" alt="">
          <div class="item-dados">
            <div class="nome">
              ${p.nome} 
              ${p.vendido ? '🔥' : ''} 
              ${estoqueHtml}
            </div>
            <div class="detalhes">Insp: ${p.insp} | ${precoExibir}</div>
          </div>
        </div>
        <div class="item-acoes">
          <button class="btn-acao btn-copiar" onclick="copiarLink('${p.id}')" title="Copiar Link">📋 Copiar</button>
          <button class="btn-acao btn-editar" onclick="prepararEdicao('${p.id}')">✏️ Editar</button>
          ${btnStatus}
          <button class="btn-acao btn-excluir" onclick="excluirPerfume('${p.id}')">🗑️ Excluir</button>
        </div>
      `;
      listaAdmin.appendChild(div);
    });
  }

  function renderizarEstoque() {
    listaEstoque.innerHTML = '';
    if (todosPerfumesAdmin.length === 0) {
      listaEstoque.innerHTML = '<p style="color:#666; text-align:center; padding:20px; font-size:0.85rem;">Nenhum perfume cadastrado.</p>';
      return;
    }

    todosPerfumesAdmin.forEach((p) => {
      const div = document.createElement('div');
      div.className = 'estoque-item';
      div.innerHTML = `
        <div class="info">
          <strong>${p.nome}</strong>
          <small>Insp: ${p.insp}</small>
        </div>
        <div class="controle">
          <input type="number" id="estoque-input-${p.id}" value="${p.estoque !== undefined ? p.estoque : 5}" min="0">
          <button class="btn-salvar-estoque" onclick="salvarEstoque('${p.id}')">Salvar</button>
        </div>
      `;
      listaEstoque.appendChild(div);
    });
  }

  window.salvarEstoque = async function(id) {
    const input = document.getElementById('estoque-input-' + id);
    let novoEstoque = parseInt(input.value);
    
    if (isNaN(novoEstoque) || novoEstoque < 0) {
      novoEstoque = 0;
      input.value = 0;
    }

    const estaIndisponivel = novoEstoque === 0;

    try {
      await updateDoc(doc(db, "perfumes", id), {
        estoque: novoEstoque,
        indisponivel: estaIndisponivel
      });
      
      if (estaIndisponivel) {
        mostrarMsg("Estoque zerado. Produto marcado como Indisponível.", "sucesso");
      } else {
        mostrarMsg("Estoque atualizado! Produto Disponível.", "sucesso");
      }
      
    } catch (error) {
      console.error(error);
      mostrarMsg("Erro ao salvar estoque.", "erro");
    }
  };

  function carregarPedidos() {
    const q = query(collection(db, "pedidos"), orderBy("data", "desc"));
    onSnapshot(q, (snapshot) => {
      listaPedidos.innerHTML = '';
      if (snapshot.empty) {
        listaPedidos.innerHTML = '<p style="color:#666; text-align:center; padding:20px; font-size:0.85rem;">Nenhum pedido registrado ainda.</p>';
        btnLimparPedidos.disabled = true;
        return;
      }
      btnLimparPedidos.disabled = false;

      snapshot.forEach((docSnap) => {
        const pedido = docSnap.data();
        const pedidoId = docSnap.id;
        
        let dataFormatada = "Data desconhecida";
        if (pedido.data) {
          const d = pedido.data.toDate ? pedido.data.toDate() : new Date(pedido.data);
          dataFormatada = d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        let itensHtml = '';
        if (pedido.itens && Array.isArray(pedido.itens)) {
          pedido.itens.forEach(item => {
            itensHtml += `<li><span>${item.qtd}x ${item.nome} (${item.tamanho})</span> <span>R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}</span></li>`;
          });
        }

        const isConcretizada = pedido.concretizada || false;
        
        const div = document.createElement('div');
        div.className = 'pedido-item ' + (isConcretizada ? 'concretizado' : '');
        div.innerHTML = `
          <div class="pedido-header">
            <span class="pedido-data">📅 ${dataFormatada}</span>
            <span class="pedido-total">R$ ${pedido.total.toFixed(2).replace('.', ',')}</span>
          </div>
          <ul class="pedido-itens">${itensHtml}</ul>
          <button class="btn-concretizada ${isConcretizada ? 'concretizada' : ''}" 
                  onclick="marcarConcretizada('${pedidoId}', ${isConcretizada})"
                  ${isConcretizada ? 'disabled' : ''}>
            ${isConcretizada ? '✅ Venda Concretizada' : '✔️ Marcar como Concretizada'}
          </button>
        `;
        listaPedidos.appendChild(div);
      });
    });
  }

  window.marcarConcretizada = async function(pedidoId, jaConcretizada) {
    if (jaConcretizada) return;
    if (!confirm("Confirmar que essa venda foi concretizada? Os itens serão descontados do estoque automaticamente.")) return;

    try {
      const pedidoSnap = await getDocs(collection(db, "pedidos"));
      let pedidoData = null;
      pedidoSnap.forEach(d => { if(d.id === pedidoId) pedidoData = d.data(); });

      if (!pedidoData) return;

      for (const item of pedidoData.itens) {
        // Prioridade: casar pelo ID (novos pedidos). Fallback: nome (pedidos antigos).
        let perfume = null;
        if (item.id) {
          perfume = todosPerfumesAdmin.find(p => p.id === item.id);
        }
        if (!perfume) {
          perfume = todosPerfumesAdmin.find(p => p.nome === item.nome);
        }
        
        if (perfume) {
          const novoEstoque = Math.max(0, (perfume.estoque || 0) - item.qtd);
          await updateDoc(doc(db, "perfumes", perfume.id), {
            estoque: novoEstoque,
            indisponivel: novoEstoque === 0 ? true : false
          });
        }
      }

      await updateDoc(doc(db, "pedidos", pedidoId), {
        concretizada: true
      });

      mostrarMsg("Venda concretizada! Estoque abatido.", "sucesso");
    } catch (error) {
      console.error(error);
      mostrarMsg("Erro ao concretizar venda.", "erro");
    }
  };

  window.limparPedidos = async function() {
    if (!confirm("Tem certeza que deseja apagar TODO o histórico de pedidos? Essa ação não pode ser desfeita.")) return;
    
    btnLimparPedidos.innerText = "Limpando...";
    btnLimparPedidos.disabled = true;

    try {
      const snapshot = await getDocs(collection(db, "pedidos"));
      for (const docSnap of snapshot.docs) {
        await deleteDoc(doc(db, "pedidos", docSnap.id));
      }
      
      mostrarMsg("Histórico limpo com sucesso!", "sucesso");
      btnLimparPedidos.innerText = "🗑️ Limpar Todo o Histórico";
      btnLimparPedidos.disabled = false;
    } catch (error) {
      console.error(error);
      mostrarMsg("Erro ao limpar histórico.", "erro");
      btnLimparPedidos.innerText = "🗑️ Limpar Todo o Histórico";
      btnLimparPedidos.disabled = false;
    }
  };

  window.copiarLink = function(id) {
    const linkCompleto = URL_CATALOGO + '#' + id;
    navigator.clipboard.writeText(linkCompleto).then(() => {
      mostrarMsg("Link copiado! Cole no WhatsApp.", "sucesso");
    }).catch(err => {
      const textarea = document.createElement('textarea');
      textarea.value = linkCompleto;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      mostrarMsg("Link copiado!", "sucesso");
    });
  };

  window.toggleEstoque = async function(id, novoStatusIndisponivel) {
    try {
      const perfumeRef = doc(db, "perfumes", id);
      const p = todosPerfumesAdmin.find(item => item.id === id);
      let novosDados = { indisponivel: novoStatusIndisponivel };
      if (!novoStatusIndisponivel && p.estoque === 0) {
        novosDados.estoque = 5;
      }
      
      await updateDoc(perfumeRef, novosDados);
      mostrarMsg(novoStatusIndisponivel ? "Produto pausado!" : "Produto ativado!", "sucesso");
    } catch (error) {
      console.error(error);
      mostrarMsg("Erro ao alterar status.", "erro");
    }
  };

  window.excluirPerfume = async function(id) {
    if (confirm("Tem certeza que deseja excluir este perfume?")) {
      try {
        await deleteDoc(doc(db, "perfumes", id));
        mostrarMsg("Perfume excluído!", "sucesso");
      } catch (error) {
        mostrarMsg("Erro ao excluir.", "erro");
      }
    }
  };

  function mostrarMsg(texto, tipo) {
    msgDiv.innerText = texto;
    msgDiv.className = `msg ${tipo}`;
    setTimeout(() => { msgDiv.className = 'msg'; }, 3000);
  }
</script>

</body>
</html>
